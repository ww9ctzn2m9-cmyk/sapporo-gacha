<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050410"><title>NEON TOUCH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050410;touch-action:none;user-select:none;-webkit-user-select:none}#arena{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 42%,#15102e,#080718 52%,#03030c)}#arena:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px}.orb{position:absolute;width:0;height:0;z-index:2;pointer-events:none;--tone:#fff;--glow:#ffffff66}.halo{position:absolute;left:0;top:0;width:132px;height:132px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 0 8px 2px white,0 0 24px 5px var(--tone),inset 0 0 25px 4px var(--tone),0 0 75px 9px var(--glow);background:radial-gradient(circle,#ffffff99 0%,var(--glow) 12%,transparent 64%);animation:breathe 1.65s ease-in-out infinite alternate}.center{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:white;box-shadow:0 0 15px 5px white,0 0 40px 18px var(--tone)}.wave{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:50%;border:2px solid #ffffffdd;transform:translate(-50%,-50%) scale(.75);box-shadow:0 0 20px var(--tone),inset 0 0 15px var(--tone);animation:wave 2.4s ease-out infinite;opacity:0}.wave.second{animation-delay:1.2s}@keyframes wave{0%{transform:translate(-50%,-50%) scale(.72);opacity:.84}100%{transform:translate(-50%,-50%) scale(2.95);opacity:0}}@keyframes breathe{from{transform:translate(-50%,-50%) scale(.84);filter:brightness(.9)}to{transform:translate(-50%,-50%) scale(1.17);filter:brightness(1.4)}}.orb.winner{z-index:10}.winner .halo{animation:win 1.05s ease-in-out infinite alternate;box-shadow:0 0 16px 7px white,0 0 55px 23px var(--tone),0 0 140px 45px var(--glow),inset 0 0 40px 10px var(--tone);border-width:5px}.winner .wave{animation-duration:1.6s}.orb.out{transition:opacity .35s,filter .35s;opacity:0;filter:blur(16px)}@keyframes win{from{transform:translate(-50%,-50%) scale(1.14)}to{transform:translate(-50%,-50%) scale(1.63)}}#count{pointer-events:none;position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);font:900 clamp(110px,34vw,250px)/1 system-ui;color:white;text-shadow:0 0 16px white,0 0 65px #ae65ff,0 0 130px #aa26fd;opacity:0}#count.show{animation:pop .86s ease-out both}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.65);filter:blur(8px)}22%{opacity:1;filter:none}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.87)}}#flash{position:absolute;inset:0;background:white;z-index:15;pointer-events:none;opacity:0}#flash.burst{animation:flash .65s ease-out}@keyframes flash{0%{opacity:.8}100%{opacity:0}}

/* Compact, softly pulsing neon rings */
.halo{width:72px;height:72px;border-width:2px;box-shadow:0 0 5px 1px white,0 0 14px 3px var(--tone),inset 0 0 12px 2px var(--tone)}
.wave{width:52px;height:52px;border-width:1.5px}
.center{width:13px;height:13px;box-shadow:0 0 9px 3px white,0 0 20px 7px var(--tone)}
.winner .halo{width:34px;height:34px;border-width:2px;animation:winSmall 1.1s ease-in-out infinite alternate;box-shadow:0 0 7px 2px white,0 0 22px 9px var(--tone)}
.winner .wave{width:30px;height:30px;animation-duration:2s}
.winner .center{display:none}
.winner .point{display:block}
.point{display:none;position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:37px/1 system-ui;filter:drop-shadow(0 0 10px #fff);z-index:5}
@keyframes winSmall{from{transform:translate(-50%,-50%) scale(.88)}to{transform:translate(-50%,-50%) scale(1.14)}}
#reset{position:absolute;z-index:25;bottom:max(9%,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:none;border:0;color:#fff;font:700 19px/1 system-ui;letter-spacing:.45em;text-shadow:0 0 12px #fff,0 0 25px #a76bff;opacity:0;transition:opacity .35s;pointer-events:none}
#reset.visible{opacity:1;pointer-events:auto}

#hint{position:absolute;z-index:12;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;transition:opacity .25s;color:#fff;width:100%}
#hint.hidden{opacity:0}
#hint .jp{font:500 13px system-ui;letter-spacing:.16em;opacity:.7;margin-bottom:12px}
#hint .en{font:800 clamp(24px,6.5vw,40px) system-ui;letter-spacing:.06em;text-shadow:0 0 13px #fff,0 0 38px #a76bff}
#bonus{position:absolute;z-index:22;top:18%;left:50%;transform:translateX(-50%);font:900 28px system-ui;color:white;text-shadow:0 0 20px white,0 0 36px #ff4de1;opacity:0;pointer-events:none}
#bonus.show{opacity:1;animation:bonusPop 1.5s ease-out}
@keyframes bonusPop{0%{transform:translateX(-50%) scale(.4);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
</style></head><body><main id="arena"><div id="flash"></div><div id="hint"><div class="jp">指を置いてください</div><div class="en">PLACE YOUR FINGERS</div></div><div id="bonus"></div><div id="count"></div><button id="reset" type="button">RESET</button></main><script>
(()=>{'use strict';
const arena=document.getElementById('arena'),count=document.getElementById('count'),flash=document.getElementById('flash'),resetBtn=document.getElementById('reset'),hint=document.getElementById('hint'),bonus=document.getElementById('bonus');
const colors=[['#ff4de1','#ff4de166'],['#4fe6ff','#4fe6ff66'],['#ae78ff','#ae78ff66'],['#69ffbb','#69ffbb66'],['#ffbd63','#ffbd6366'],['#ff648c','#ff648c66'],['#8c99ff','#8c99ff66']];
let audioCtx=null;
function unlockSound(){
  try{
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch{}
}
function touchSound(){
  try{
    if(!audioCtx||audioCtx.state!=='running')return;
    const t=audioCtx.currentTime;
    const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(540,t);
    osc.frequency.exponentialRampToValueAtTime(410,t+.17);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.075,t+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.27);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+.28);
  }catch{}
}
function winnerSound(){
  try{
    if(!audioCtx||audioCtx.state!=='running')return;
    const t=audioCtx.currentTime;
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(520,t);
    osc.frequency.exponentialRampToValueAtTime(330,t+.24);
    gain.gain.setValueAtTime(.0001,t);
    gain.gain.exponentialRampToValueAtTime(.22,t+.025);
    gain.gain.exponentialRampToValueAtTime(.0001,t+.38);
    osc.connect(gain);gain.connect(audioCtx.destination);
    osc.start(t);osc.stop(t+.4);
  }catch{}
}
const fingers=new Map();let phase='gather',timer=null,seed=0,releaseReady=false,winners=[];
function create(id,x,y){const c=colors[seed++%colors.length],el=document.createElement('div');el.className='orb';el.style.setProperty('--tone',c[0]);el.style.setProperty('--glow',c[1]);el.style.left=x+'px';el.style.top=y+'px';el.innerHTML='<div class="wave"></div><div class="wave second"></div><div class="halo"></div><div class="center"></div><div class="point">🫵</div>';arena.appendChild(el);fingers.set(id,{el});}
function clearClock(){clearInterval(timer);timer=null;count.classList.remove('show');count.textContent='';}
function reset(){clearClock();phase='gather';winners=[];releaseReady=false;resetBtn.classList.remove('visible');hint.classList.remove('hidden');bonus.classList.remove('show');bonus.textContent='';document.querySelectorAll('.orb').forEach(el=>el.remove());fingers.clear();}
function show(n){count.classList.remove('show');void count.offsetWidth;count.textContent=n;count.classList.add('show');}
function begin(){if(phase!=='gather'||fingers.size<2)return;phase='countdown';hint.classList.add('hidden');let n=5;show(n);timer=setInterval(()=>{if(phase!=='countdown')return;if(fingers.size<2){clearClock();phase='gather';hint.classList.remove('hidden');return;}--n;if(n)show(n);else{clearClock();choose();}},1000);}
function choose(){if(fingers.size<2){phase='gather';hint.classList.remove('hidden');return;}phase='result';winnerSound();const ids=[...fingers.keys()];const double=ids.length>=3&&Math.random()<0.035;const first=Math.floor(Math.random()*ids.length);winners=[ids[first]];if(double){const rest=ids.filter(id=>id!==winners[0]);winners.push(rest[Math.floor(Math.random()*rest.length)]);bonus.textContent='🫵 ×2';bonus.classList.remove('show');void bonus.offsetWidth;bonus.classList.add('show');}for(const [id,f] of fingers){if(winners.includes(id))f.el.classList.add('winner');else{f.el.classList.add('out');setTimeout(()=>{if(f.el.isConnected)f.el.remove()},390)}}resetBtn.classList.add('visible');flash.classList.remove('burst');void flash.offsetWidth;flash.classList.add('burst');try{navigator.vibrate?.([140,65,200]);}catch{}}
function down(e){e.preventDefault();unlockSound();if(fingers.has(e.pointerId))return;if(phase==='result'){if(!releaseReady)return;reset();}try{arena.setPointerCapture(e.pointerId)}catch{}touchSound();create(e.pointerId,e.clientX,e.clientY);if(phase==='gather'&&fingers.size>=2)begin();}
function up(e){const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();fingers.delete(e.pointerId);if(phase==='result'){if(!winners.includes(e.pointerId))f.el.remove();if(fingers.size===0)releaseReady=true;return;}f.el.remove();if(phase==='countdown'&&fingers.size<2){clearClock();phase='gather';hint.classList.remove('hidden');}}
arena.addEventListener('pointerdown',down,{passive:false});arena.addEventListener('pointerup',up,{passive:false});arena.addEventListener('pointercancel',up,{passive:false});resetBtn.addEventListener('pointerdown',e=>e.stopPropagation());resetBtn.addEventListener('click',()=>reset());window.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});
})();
</script></body></html>
