<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050410"><title>NEON TOUCH</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050410;touch-action:none;user-select:none;-webkit-user-select:none}#arena{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at 50% 42%,#15102e,#080718 52%,#03030c)}#arena:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.2;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px}.orb{position:absolute;width:0;height:0;z-index:2;pointer-events:none;--tone:#fff;--glow:#ffffff66}.halo{position:absolute;left:0;top:0;width:132px;height:132px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 0 8px 2px white,0 0 24px 5px var(--tone),inset 0 0 25px 4px var(--tone),0 0 75px 9px var(--glow);background:radial-gradient(circle,#ffffff99 0%,var(--glow) 12%,transparent 64%);animation:breathe 1.65s ease-in-out infinite alternate}.center{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;background:white;box-shadow:0 0 15px 5px white,0 0 40px 18px var(--tone)}.wave{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:50%;border:2px solid #ffffffdd;transform:translate(-50%,-50%) scale(.75);box-shadow:0 0 20px var(--tone),inset 0 0 15px var(--tone);animation:wave 2.4s ease-out infinite;opacity:0}.wave.second{animation-delay:1.2s}@keyframes wave{0%{transform:translate(-50%,-50%) scale(.72);opacity:.84}100%{transform:translate(-50%,-50%) scale(2.95);opacity:0}}@keyframes breathe{from{transform:translate(-50%,-50%) scale(.84);filter:brightness(.9)}to{transform:translate(-50%,-50%) scale(1.17);filter:brightness(1.4)}}.orb.winner{z-index:10}.winner .halo{animation:win 1.05s ease-in-out infinite alternate;box-shadow:0 0 16px 7px white,0 0 55px 23px var(--tone),0 0 140px 45px var(--glow),inset 0 0 40px 10px var(--tone);border-width:5px}.winner .wave{animation-duration:1.6s}.orb.out{transition:opacity .35s,filter .35s;opacity:0;filter:blur(16px)}@keyframes win{from{transform:translate(-50%,-50%) scale(1.14)}to{transform:translate(-50%,-50%) scale(1.63)}}#count{pointer-events:none;position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);font:900 clamp(110px,34vw,250px)/1 system-ui;color:white;text-shadow:0 0 16px white,0 0 65px #ae65ff,0 0 130px #aa26fd;opacity:0}#count.show{animation:pop .86s ease-out both}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(1.65);filter:blur(8px)}22%{opacity:1;filter:none}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.87)}}#flash{position:absolute;inset:0;background:white;z-index:15;pointer-events:none;opacity:0}#flash.burst{animation:flash .65s ease-out}@keyframes flash{0%{opacity:.8}100%{opacity:0}}
</style></head><body><main id="arena"><div id="flash"></div><div id="count"></div></main><script>
(()=>{'use strict';const arena=document.getElementById('arena'),count=document.getElementById('count'),flash=document.getElementById('flash');const colors=[['#ff4de1','#ff4de166'],['#4fe6ff','#4fe6ff66'],['#ae78ff','#ae78ff66'],['#69ffbb','#69ffbb66'],['#ffbd63','#ffbd6366'],['#ff648c','#ff648c66'],['#8c99ff','#8c99ff66']];const fingers=new Map();let phase='gather',timer=null,champion=null,seed=0;
function create(id,x,y){const c=colors[seed++%colors.length],el=document.createElement('div');el.className='orb';el.style.setProperty('--tone',c[0]);el.style.setProperty('--glow',c[1]);el.style.left=x+'px';el.style.top=y+'px';el.innerHTML='<div class="wave"></div><div class="wave second"></div><div class="halo"></div><div class="center"></div>';arena.appendChild(el);fingers.set(id,{el});}
function clear(){clearInterval(timer);timer=null;count.classList.remove('show');count.textContent='';}
function reset(){clear();phase='gather';champion=null;for(const f of fingers.values())f.el.remove();fingers.clear();}
function show(n){count.classList.remove('show');void count.offsetWidth;count.textContent=n;count.classList.add('show');}
function begin(){if(phase!=='gather'||fingers.size<2)return;phase='countdown';let n=3;show(n);timer=setInterval(()=>{if(phase!=='countdown')return;if(fingers.size<2){clear();phase='gather';return;}--n;if(n)show(n);else{clear();choose();}},1000);}
function choose(){if(fingers.size<2){phase='gather';return;}phase='result';const ids=[...fingers.keys()];champion=ids[Math.floor(Math.random()*ids.length)];for(const [id,f] of fingers){if(id===champion)f.el.classList.add('winner');else{f.el.classList.add('out');setTimeout(()=>{if(f.el.isConnected)f.el.remove()},390)}}flash.classList.remove('burst');void flash.offsetWidth;flash.classList.add('burst');navigator.vibrate?.([65,40,110]);}
function down(e){e.preventDefault();if(phase==='result'||fingers.has(e.pointerId))return;try{arena.setPointerCapture(e.pointerId)}catch{}create(e.pointerId,e.clientX,e.clientY);if(phase==='gather'&&fingers.size>=2)begin();}
function move(e){const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(phase==='result'&&e.pointerId!==champion)return;f.el.style.left=e.clientX+'px';f.el.style.top=e.clientY+'px';}
function up(e){const f=fingers.get(e.pointerId);if(!f)return;e.preventDefault();if(phase==='result'){fingers.delete(e.pointerId);if(e.pointerId===champion||fingers.size===0)reset();return;}f.el.remove();fingers.delete(e.pointerId);if(phase==='countdown'&&fingers.size<2){clear();phase='gather';}}
arena.addEventListener('pointerdown',down,{passive:false});arena.addEventListener('pointermove',move,{passive:false});arena.addEventListener('pointerup',up,{passive:false});arena.addEventListener('pointercancel',up,{passive:false});window.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)reset()});})();
</script></body></html>
