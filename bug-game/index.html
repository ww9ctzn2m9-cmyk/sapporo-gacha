function setHTML(html){app.innerHTML=html;window.scrollTo(0,0)}function btn(t,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${t}</button>`}function playerList(){return `<div class="players">${S.players.map(p=>`<div class="player ${p.alive?'':'dead'}"><span>${esc(p.name)} ${p.id===S.current?'👈':''}</span><span>${p.alive?'🛡️'+p.shields:'💀'} ${p.skip?'💤':''} ${p.mark?'⚠️':''}</span></div>`).join('')}</div>`}function header(){return `<div class="row spread"><span class="kicker">このゲーム、バグってます。</span><span class="pill">${S.mode==='hand'?'手札':'完全ランダム'}</span></div><div class="stats"><span class="stat">ターン ${S.turn+1}</span><span class="stat">生存 ${alive().length}/${S.players.length}</span><span class="stat">世界: ${ruleText()}</span></div>`}function history(){return `<details class="panel"><summary>これまでの出来事</summary><div class="log">${S.history.map(s=>`<p>${esc(s)}</p>`).join('')||'まだ何も起きていません'}</div></details>`}
function show(){if(!S)return home();if(S.phase==='end'){let w=player(S.winner);setHTML(`<div class="center"><div class="kicker">GAME OVER</div><div class="bigemoji">🏆</div><h1> ${esc(w.name)} の優勝！</h1><div class="panel">${esc(S.winReason)}</div></div>${playerList()}${history()}${btn('同じメンバーでもう一度', 'rematch()')}${btn('タイトルに戻る','home()', 'secondary')}`);return}if(S.phase==='draw'){setHTML(`<div class="center"><div class="bigemoji">🤯</div><h1>全滅！引き分け！</h1></div>${history()}${btn('再戦','rematch()')}${btn('タイトルに戻る','home()','secondary')}`);return}
if(S.phase==='pass'){let p=me();setHTML(`${header()}<div class="panel center"><div class="bigemoji">📱</div><div class="kicker">スマホを渡してね</div><div class="title">${esc(p.name)} のターン</div><p class="sub">本人だけが画面を見てください。<br>秘密の条件・手札はほかの人に見せないで！</p>${btn('自分のターンを始める','startTurn()')}</div>${playerList()}${history()}<button class="btn ghost" onclick="askExit()">タイトルに戻る</button>`);return}
if(S.phase==='play'){let p=me(),content=S.mode==='hand'?`<p class="sub">カードを1枚選んで使おう。</p><div class="cards">${p.hand.map((id,i)=>cardHTML(cards[id],`useCard(${i})`)).join('')}</div>`:`<p class="sub">1枚引いて、問答無用で効果発動！</p>${btn('運命のカードを引く','drawRandom()')}`;setHTML(`${header()}<div class="panel" style="${S.upside?'transform:rotate(180deg)':''}"><div class="row spread"><h2 style="margin:0">${esc(p.name)} のターン</h2><span class="badge">🔒 非公開</span></div><div class="secret"><div class="kicker">あなただけの秘密の勝利条件</div><div class="title" style="font-size:18px">${esc(missions[p.secret][0])}</div><div class="sub">${esc(missions[p.secret][1])}</div><div class="tiny">条件はカード解決後に判定。脱落中は達成不可。</div></div></div>${content}<div class="space"></div>${btn('手札を1枚捨てる（効果なし）','discard()','secondary') .replace('class="btn secondary"',`class="btn secondary ${S.mode==='hand'?'':'hidden'}"`)}${history()}<button class="btn ghost" onclick="askExit()">タイトルに戻る</button>`);return}
if(S.phase==='reveal'){let c=cards[S.card],p=me();setHTML(`${header()}<div class="center"><div class="kicker">【イベント発生!!】</div><div class="title">${esc(p.name)} のカード</div>${cardHTML(c,'',true)}<p class="sub">${esc(c.desc)}</p></div><div class="space"></div>${btn('効果を発動！','resolveCard()')}`);return}
if(S.phase==='target'){let p=me(),t=S.targetOptions;setHTML(`${header()}<div class="panel"><div class="kicker">【イベント発生!!】 対象を選択</div><h2>${esc(cards[S.card].name)}</h2><p class="sub">${esc(cards[S.card].desc)}</p><div class="stack">${t.map(id=>`<button class="choice" onclick="pickTarget(${id})">${esc(player(id).name)} ${player(id).alive?'':'（脱落中）'}</button>`).join('')}</div></div>${btn('対象がいないのでスキップ','skipTarget()','secondary')}`);return}
if(S.phase==='result'){setHTML(`${header()}<div class="panel center"><div class="kicker">【イベント発生!!】</div><div class="title">${esc(cards[S.card].name)}</div><div class="bigemoji">${cards[S.card].emoji}</div><p style="line-height:1.8;font-weight:750">${esc(S.result)}</p></div>${playerList()}${btn('次へ','endTurn()')}${history()}`);return}
}
function cardHTML(c,handler,big=false){return `<button ${handler?`onclick="${handler}"`:''} class="card ${big?'single':''}" style="background:${palette[c.category]};${handler?'':'cursor:default'}"><span class="kind">${c.category}</span><span class="emoji">${c.emoji}</span><span class="ct">${esc(c.name)}</span><span class="cd">${esc(c.desc)}</span></button>`}
function home(){S=null;let pre=['田中','佐藤','鈴木','山本'];setHTML(`<div class="kicker" style="margin-top:26px">理不尽系スマホ回しゲーム</div><h1 class="hero">このゲーム、<br><span style="color:#f4d77c">バグってます。</span></h1><p class="sub">突然勝つ。突然負ける。理由は特にない。<br>スマホ1台をみんなで回して遊ぼう。</p><div class="panel"><div class="label">ゲームモード</div><div class="toggle"><button id="mode-hand" class="active" onclick="selectMode('hand')">🃏 手札制</button><button id="mode-random" onclick="selectMode('random')">🎲 完全ランダム</button></div><div class="label">① プレイヤー人数を選択</div><div class="count-grid">${Array.from({length:8},(_,i)=>`<button class="count-option" id="count-${i+3}" onclick="chooseCount(${i+3})">${i+3}人</button>`).join('')}</div><div id="name-step" class="hidden"><div class="label" style="margin-top:22px">② プレイヤー名を入力 <span class="pill" id="num-label"></span></div><p class="tiny">空欄でもOK！ その場合は「プレイヤー1」などの名前になるよ。</p><div id="names" class="stack"></div><div class="space"></div>${btn('ゲーム開始！','begin()')}</div></div><details class="panel rules"><summary>遊び方・ルール</summary><p>順番にスマホを渡し、カードを使用・抽選。自分だけの秘密の勝利条件を達成するか、最後まで生き残ると勝利！</p><p>手札制は3枚から1枚使い、使用後に補充。完全ランダムはカードを1枚引いて即発動。カードは120種類。</p><p>シールドは脱落判定を1回防ぎます。脱落者を復帰させられるのは復活カードだけ。世界ルールは新しい世界ルールで上書き。</p><p>秘密の勝利条件は、カードの効果を解決した後に判定されます。秘密条件・カードの種類は重複あり。</p><p>プレイヤーごとの秘密情報は、本人がスマホを受け取った後にだけ表示されます。プレイヤー同士で画面を見ないようにしましょう。</p><p>実験版のため、音声や端末センサーに頼るカードはありません。画面内で処理が完結します。</p></details><div class="footer">120種類の理不尽カード / オフラインでも動く単一HTML版</div>`);window.currentMode='hand';window.chosenCount=null}
function selectMode(m){window.currentMode=m;$('#mode-hand').classList.toggle('active',m==='hand');$('#mode-random').classList.toggle('active',m==='random')}
function chooseCount(n){let arr=[...document.querySelectorAll('.namefield')].map(x=>x.value);window.chosenCount=n;document.querySelectorAll('.count-option').forEach(b=>b.classList.toggle('active',b.id==='count-'+n));$('#name-step').classList.remove('hidden');$('#num-label').textContent=n+'人';$('#names').innerHTML=Array.from({length:n},(_,i)=>`<label class="name-item"><span>${i+1}人目</span><input class="field namefield" maxlength="16" placeholder="プレイヤー${i+1}" value="${esc(arr[i]||'')}"></label>`).join('')}
function begin(){let names=[...document.querySelectorAll('.namefield')].map((x,i)=>x.value.trim()||`プレイヤー${i+1}`);init(names,window.currentMode)}function rematch(){const names=S.players.map(p=>p.name),mode=S.mode;init(names,mode)}function askExit(){if(confirm('対戦を終了してタイトルに戻りますか？'))home()}
function nextIndex(from){let a=S.order,idx=a.indexOf(from);for(let i=1;i<=a.length;i++){let id=a[(idx+i*S.direction+a.length*10)%a.length];if(player(id).alive)return id}return from}
function startTurn(){let p=me();if(!p.alive){S.current=nextIndex(p.id);show();return}if(p.skip){p.skip--;log(`${p.name}は1回休み！`);S.phase='result';S.card=cards.find(c=>c.action==='nothing').id;S.result=`${p.name}は1回休み！`;show();return}S.phase='play';show()}
function useCard(i){let p=me();if(S.phase!=='play'||S.mode!=='hand'||i<0||i>=p.hand.length)return;S.card=p.hand.splice(i,1)[0];S.phase='reveal';show()}
function discard(){if(S.mode!=='hand'||S.phase!=='play')return;let p=me();if(!p.hand.length)return toast('捨てられるカードがありません');if(!confirm('手札の先頭を捨ててターンを終える？'))return;p.hand.shift();S.card=cards.find(c=>c.action==='nothing').id;S.result='カードを1枚捨てた。何も起こらなかった。';S.phase='result';show()}
function drawRandom(){if(S.phase!=='play')return;S.card=draw();S.phase='reveal';show()}
function setResult(t){S.result=t;S.phase='result';log(t);checkEnd();if(S.phase!=='end'&&S.phase!=='draw')show();else show()}
function chooseTarget(options){if(!options.length){setResult('対象がいません。何も起こりませんでした。');return}S.targetOptions=options.map(p=>p.id);S.phase='target';show()}
function resolveCard(){if(S.phase!=='reveal')return;let c=cards[S.card],p=me(),a=c.action;if(c.category==='攻撃')p.attacks++;if(['kill','mark','strip','duel','coinKill','skip','steal','gift','swapHand','peek','switchSeat'].includes(a)){let targets=S.players.filter(q=>(a==='gift'||a==='swapHand'||a==='steal'||a==='peek'||a==='switchSeat'||a==='strip'||a==='skip'||a==='mark'||a==='kill'||a==='duel'||a==='coinKill')?q.alive&&q.id!==p.id:false);chooseTarget(targets);return}perform(null)}
function pickTarget(id){if(S.phase!=='target'||!S.targetOptions.includes(id))return;perform(player(id))}function skipTarget(){if(S.phase==='target')setResult('選べる対象がいなかったため、何も起こりませんでした。')}
function perform(t){let c=cards[S.card],p=me(),a=c.action,msg='';if(a==='kill')msg=elimination(t,p,{attack:true});else if(a==='mark'){t.mark++;p.marksGiven++;msg=`${t.name}に危険マーク！ 次に自分のターンが来た時にシールド1枚消費、なければ脱落`;}
else if(a==='strip'){msg=`${t.name}のシールド${t.shields}枚を破壊！`;t.shields=0}
else if(a==='duel'){let loser=rand(2)?p:t;msg=`決闘の敗者は${loser.name}！ ${elimination(loser,loser===p?t:p,{attack:true})}`}
else if(a==='coinKill'){let loser=rand(2)?p:t;msg=`運命の結果は${loser.name}！ ${elimination(loser,loser===p?t:p,{attack:true})}`}
else if(a==='randomKill'){let q=randomAlive();msg=elimination(q,p,{attack:true})}
else if(a==='shield'||a==='shield2'){p.shields+=(a==='shield2'?2:1);msg=`${p.name}はシールドを${a==='shield2'?2:1}枚獲得！`}
else if(a==='revive'){let dead=S.players.filter(q=>!q.alive);if(dead.length){let q=dead[rand(dead.length)];q.alive=true;q.skip=0;q.mark=0;q.shields=0;p.revives++;msg=`🧟 復活カード！ ${q.name}が復活！`;}else msg='脱落者がいないので、復活カードは不発！'}
else if(a==='reverse'){S.direction*=-1;p.orderChanges++;msg='プレイ順が逆になった！'}
else if(a==='resetOrder'){S.direction=1;msg='プレイ順が正回りに戻った！'}
else if(a==='skip'){t.skip++;msg=`${t.name}は次のターンを1回休み！`}
else if(a==='randomNext'){let q=randomAlive();S.forcedNext=q?.id??null;msg=`次のターンは ${q?.name||'なし'}！`;p.orderChanges++}
else if(a==='rotateHands'){if(S.mode==='hand'){let old=S.players.map(q=>[...q.hand]);S.players.forEach((q,i)=>q.hand=old[(i-1+old.length)%old.length]);msg='全員の手札が右隣に移動した！'}else{S.direction*=-1;msg='ランダムモードなのでプレイ順が逆転！'}p.orderChanges++}
else if(a==='steal'){if(S.mode==='hand'&&t.hand.length){p.hand.push(t.hand.splice(rand(t.hand.length),1)[0]);msg=`${t.name}からカードを1枚奪った！`}else {S.forcedNext=t.id;msg=`次は${t.name}のターン！`} }
else if(a==='gift'){if(S.mode==='hand'&&p.hand.length){t.hand.push(p.hand.splice(rand(p.hand.length),1)[0]);msg=`${t.name}に手札を1枚渡した！`}else {t.shields++;msg=`${t.name}にシールド1枚プレゼント！`}}
else if(a==='switchSeat'){let i=S.order.indexOf(p.id),j=S.order.indexOf(t.id);[S.order[i],S.order[j]]=[S.order[j],S.order[i]];p.orderChanges++;msg=`${p.name}と${t.name}の順番が入れ替わった！`}
else if(a==='shuffleSeats'){S.order=shuffle(S.order);p.orderChanges++;msg='プレイ順がめちゃくちゃになった！'}
else if(a==='extra'){S.extra=true;msg=`${p.name}はターンをもう一度！`}
else if(a==='swapHand'){if(S.mode==='hand'){[p.hand,t.hand]=[t.hand,p.hand];msg=`${t.name}と手札を交換！`}else {S.forcedNext=t.id;msg=`ランダムモード：次は${t.name}！`}}
else if(a==='peek'){msg=`${t.name}の秘密条件は「${missions[t.secret][0]}」：${missions[t.secret][1]}`} // only visible to acting player
else if(a==='instantWin'){if(S.rule==='noWin')msg='「優勝禁止」のため即勝利は無効！';else{win(p,'カード「'+c.name+'」');show();return}}
else if(a==='selfKill'){msg=elimination(p,null,{force:true})}
else if(a==='nothing'){msg='何も起きなかった。本当に。'}
else if(a==='coinWin'||a==='lowWin'){let good=rand(a==='coinWin'?2:10)===0;if(good&&S.rule!=='noWin'){win(p,'カード「'+c.name+'」の抽選成功');show();return}msg=good?'当たり！ しかし優勝禁止ルールで無効！':'残念、抽選に外れました。'}
else if(a==='storm'){msg=S.players.filter(q=>q.alive&&q.id!==p.id).map(q=>rand(10)<3?elimination(q,p,{attack:true}):`${q.name}は無事！`).join(' / ')||'ほかに誰もいない'}
else if(a==='stripAll'){S.players.forEach(q=>q.shields=0);msg='全員のシールドが消えた！'}
else if(a==='skipAll'){S.players.filter(q=>q.alive&&q.id!==p.id).forEach(q=>q.skip++);msg='自分以外の全員が次のターン1回休み！'}
else if(a.startsWith('rule')){if(a==='ruleShield'){S.players.filter(q=>q.alive).forEach(q=>q.shields++);msg='全員シールド1枚獲得！'}else{S.rule=({rulePower:'power',ruleNoWin:'noWin',rulePeace:'peace',ruleNormal:'normal'})[a];msg=`世界ルール変更：${ruleText()}！`}}
else if(a==='fakeWin'){msg='🎊 おめでとうございます！ 優勝……ではありませんでした！'}
else if(a==='upside'){S.upside=true;msg='次の人は画面が逆さまになる……かもしれない！（演出のみ）'}
else if(a==='operator'){if(rand(2)){let q=randomAlive();q.shields++;msg=`運営は${q.name}に盾1枚をプレゼント`}else{let q=randomAlive();msg=`運営の攻撃！ ${elimination(q,p,{attack:true})}`}}
else msg='何も起こらなかった';setResult(msg)}
function endTurn(){if(S.phase!=='result')return;let p=me();p.turns++;S.upside=false;if(p.shields>0)p.safeTurns++;if(S.mode==='hand'&&p.alive)fill(p); // resolve delayed mark at turn end? applied at start of next own turn below
p.secretEligible=true;checkEnd();if(S.winner===null&&S.phase!=='draw')checkSecrets();if(S.phase==='end'||S.phase==='draw'){show();return}
S.turn++;if(S.extra&&p.alive){S.extra=false;S.phase='pass';show();return}S.extra=false;let n=(S.forcedNext!==null&&player(S.forcedNext)?.alive)?S.forcedNext:nextIndex(p.id);S.forcedNext=null;S.current=n;let np=me();if(np.mark){let marks=np.mark;np.mark=0;for(let i=0;i<marks&&np.alive;i++)log('危険マーク発動: '+elimination(np,null,{attack:true}));checkEnd();if(S.phase==='end'||S.phase==='draw'){show();return}if(!np.alive)S.current=nextIndex(np.id)}S.phase='pass';show()}
function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2200)}home();
</script></body></html>
