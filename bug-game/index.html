<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>このゲーム、バグってます。</title><style>
:root{font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:#f9f7ff;background:#171725}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 80% 0,#38304e 0,transparent 45%),#171725}button,input,select{font:inherit}button{cursor:pointer;border:0}button:disabled{opacity:.4;cursor:default}.app{max-width:520px;margin:auto;padding:20px 16px 54px}.kicker{font-size:12px;color:#bdb0dd;letter-spacing:.18em;font-weight:800}.hero{font-size:clamp(29px,8vw,43px);line-height:1.22;margin:10px 0 12px;letter-spacing:-.04em}.sub{color:#bbb9c9;line-height:1.7;font-size:14px}.panel{background:#252537;border:1px solid #424154;border-radius:20px;padding:19px;margin:16px 0;box-shadow:0 9px 25px #0a0a1322}.row{display:flex;gap:10px;align-items:center}.spread{justify-content:space-between}.stack{display:grid;gap:10px}.btn{background:#f7dc78;color:#24202b;font-weight:900;padding:15px 18px;border-radius:13px;width:100%;min-height:52px;box-shadow:0 3px 0 #a7872e}.btn.secondary{background:#414055;color:#fff;box-shadow:none}.btn.danger{background:#eaa5ae;box-shadow:none}.btn.small{width:auto;min-height:38px;padding:8px 12px;font-size:13px}.btn.ghost{background:transparent;color:#d0cfe1;box-shadow:none;border:1px solid #515064}.label{font-size:13px;font-weight:800;margin:12px 0 6px}.field{background:#171723;color:white;border:1px solid #605d78;border-radius:10px;padding:12px;width:100%;font-size:16px}.pill{font-size:12px;background:#3d3852;color:#f4d889;padding:5px 9px;border-radius:99px;white-space:nowrap}.players{display:grid;gap:8px}.player{padding:11px 12px;background:#313044;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.dead{opacity:.5;text-decoration:line-through}.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.stat{border-radius:100px;background:#312e43;padding:7px 10px;font-size:12px;color:#d7d4e7}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{min-height:176px;border-radius:13px;color:#292535;padding:11px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;gap:9px;transition:transform .1s;word-break:break-word}.card:active{transform:scale(.96)}.card .emoji{font-size:34px}.card .ct{font-size:15px;font-weight:900}.card .cd{font-size:11px;line-height:1.45}.card .kind{font-size:10px;opacity:.65;font-weight:800}.single{max-width:260px;min-height:260px;margin:auto;padding:20px}.single .ct{font-size:22px}.single .emoji{font-size:52px}.single .cd{font-size:14px}.box-note{padding:12px;border-radius:12px;background:#181724;color:#d6d2e2;font-size:13px;line-height:1.7}.title{font-size:23px;font-weight:900;line-height:1.35;margin:12px 0}.center{text-align:center}.event{border:2px solid #f8d773;border-radius:14px;padding:14px;background:#453828}.hidden{display:none!important}.choice{padding:14px;border:1px solid #56536a;border-radius:12px;width:100%;background:#343149;color:#fff;text-align:left;font-weight:700}.choice:disabled{opacity:.35}.check{accent-color:#f5d76d}.tiny{font-size:11px;color:#a8a5b5;line-height:1.6}.bigemoji{font-size:64px;line-height:1.2;margin:22px 0}.log{font-size:12px;color:#bdb9d0;line-height:1.55;max-height:165px;overflow:auto}.log p{margin:7px 0;border-bottom:1px solid #3d3b50;padding-bottom:7px}.count{font-size:52px;font-weight:1000;color:#f8dc81}.footer{font-size:11px;color:#8d899d;margin-top:22px;text-align:center}.count-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:10px}.count-option{border:1px solid #6b667d;background:#363247;color:#f5f1ff;border-radius:13px;min-height:55px;font-size:20px;font-weight:900}.count-option.active{background:#f4d77c;color:#24202b;border-color:#f4d77c}.name-item{display:flex;align-items:center;gap:12px}.name-item span{font-size:12px;color:#c8c4d9;min-width:54px}.toggle{display:flex;gap:8px}.toggle button{width:50%;border:1px solid #5b586b;color:#d8d3e8;background:#333044;padding:12px 8px;border-radius:12px;font-weight:800}.toggle button.active{background:#f3d77b;color:#24202b;border-color:#f3d77b}.badge{display:inline-block;background:#53446b;padding:5px 9px;border-radius:9px;font-size:12px;color:#fff}.secret{background:linear-gradient(120deg,#54486a,#33334c);border:1px solid #76618b;padding:15px;border-radius:14px}.rules{line-height:1.75;color:#d2cfdf;font-size:13px}.rules summary{font-size:14px;cursor:pointer;font-weight:800;color:#f4dd8e}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:92vw;background:#f5d987;color:#211f2a;padding:10px 16px;border-radius:12px;font-weight:800;display:none;z-index:99;text-align:center}.space{height:10px}
</style></head><body><main id="app" class="app"></main><script>
const app=document.getElementById('app'),$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>a.sort(()=>Math.random()-.5);
const quests=[
["👃","鼻が好き","次の自分のターンまで鼻を触り続ける。指摘されなかったら勝利。","しぐさ"],
["🍹","空っぽの証明","次の自分のターンまでに自分の飲み物が自然に空になっていたら、空のグラスを披露して勝利。急いで飲む必要はない。","飲み物"],
["🐱","猫になった","次の自分のターンまで、自分が発言する際は語尾に「にゃ」を付ける。誰にも指摘されなければ勝利。","会話"],
["🪑","席替え大臣","次の自分のターンまでに誰かと席を交換し、その理由をゲームだと見抜かれなければ勝利。","行動"],
["🤫","透明人間","次の自分のターンまで一度も声を出さず、周囲に不審がられなければ勝利。","会話"],
["👏","拍手をください","次の自分のターンまでに、ゲームが理由だと説明せずに1人から拍手をもらえたら勝利。","会話"],
["🖐️","手は頭の上","次の自分のターンまでに3回以上頭の上に手を置く。指摘されなければ勝利。","しぐさ"],
["🧂","しょっぱい話","次の自分のターンまでに「塩」という単語を自然に2回会話へ混ぜて、指摘されなければ勝利。","会話"],
["😎","謎のサングラス","自分の次のターンまでに誰かから「かっこいい」と言われたら勝利。誘導してもOK。","会話"],
["🥄","スプーン外交","次の自分のターンまでに誰かからスプーンか箸を借りたら勝利。","行動"],
["💪","突然の筋肉","次の自分のターンまでに一度だけ力こぶを披露し、誰にも理由を聞かれなければ勝利。","しぐさ"],
["🤝","握手会","次の自分のターンまでに誰かと握手できたら勝利。","行動"],
["📣","褒め殺し","次の自分のターンまでに別々の2人を自然に褒めて、カードの存在を指摘されなければ勝利。","会話"],
["👀","アイコンタクト","次の自分のターンまでに誰かと3秒見つめ合えたら勝利。","行動"],
["😴","あくび感染","次の自分のターンまでに誰かがあくびしたら勝利。自分のあくびはノーカウント。","観察"],
["🧊","氷の哲学者","次の自分のターンまでに誰かに「なんで？」と言わせられたら勝利。","会話"],
["🙃","逆さ言葉","次の自分のターンまでに「逆に」を3回会話に混ぜる。指摘されなければ勝利。","会話"],
["🎤","急な司会","次の自分のターンまでに誰かから質問を2つ受けたら勝利。","会話"],
["🦀","横歩き","次の自分のターンまでにカニ歩きを一歩だけして、誰にも指摘されなければ勝利。安全な場所でだけ実行。","行動"],
["🥳","おめでとう","次の自分のターンまでに誰かに「おめでとう」と言わせたら勝利。","会話"],
["🍪","おかわり名人","次の自分のターンまでに誰かから食べ物か飲み物を勧めてもらえたら勝利。断ってもOK。","会話"],
["📱","画面の向こう","次の自分のターンまでに誰かから「何してるの？」と言われたら勝利。","観察"],
["👑","王様の敬語","次の自分のターンまで、発言は必ず敬語。バレなければ勝利。","会話"],
["🗿","石像","次の自分のターンまでに10秒間まったく動かず、指摘されなければ勝利。","しぐさ"]
];
const adjectives=["絶妙な","伝説の","謎すぎる","ほぼ無意味な","ちょっと恥ずかしい"];
const extras=[
["🐸","カエルの話","次の自分のターンまでに会話で「カエル」を自然に言えたら勝利。","会話"],
["🎲","偶然ですね","次の自分のターンまでに「偶然」を2回言えたら勝利。","会話"],
["🕺","一瞬ダンス","次の自分のターンまでに肩を一回踊らせ、誰にも指摘されなければ勝利。","しぐさ"],
["🤡","変顔","次の自分のターンまでに変顔を1回して、誰にも指摘されなければ勝利。","しぐさ"],
["🧠","知ったか博士","次の自分のターンまでに誰かから「そうなんだ」と言われたら勝利。","会話"],
["🧻","ティッシュ大臣","次の自分のターンまでに誰かからティッシュをもらえたら勝利。","行動"]
];
const tasks=[...quests,...extras]; // 30個の固有ミッション + 30種の派生条件
for(let i=0;i<30;i++){let q=tasks[i],tail=i%3===0?'ただし笑われたら失敗。':i%3===1?'ただしゲームのためだと見破られたら失敗。':'ただし途中で自分からカードの話をしたら失敗。';tasks.push([q[0],adjectives[i%5]+q[1],q[2]+' '+tail,q[3]])}
const instant=[
["🔁","逆回転","スマホを回す方向が逆になる。"],
["👥","全員、敬礼！","その場で誰でも敬礼してよい。やらなくても罰はない。"],
["📢","変な掛け声","全員で「バグってます！」と言おう。"],
["🧑‍⚖️","異議あり","今の人は隣の人に『異議あり！』と言ってみよう。"],
["🥸","呼び名会議","次の一周だけ、お互いを『先生』と呼んで遊ぼう。"],
["🎭","役者魂","今の人は5秒だけ大げさな顔を披露しよう。"],
["⏩","順番飛ばし","次の人のターンを1回飛ばす。"],
["❓","謎の質問","次の人に『ところで宇宙って広い？』と聞こう。"],
["😱","全員びっくり","驚いたふりをしよう。しなくても大丈夫。"],
["🛎️","突然の休憩","10秒間、全員無言になってみよう。"],
["🎉","偽の優勝","優勝した雰囲気だけ演出！ 残念、ゲームは続きます。"],
["🃏","おかわり","このターン終了後、もう一度あなたのターン。"],
["🤝","あだ名交換","全員好きなあだ名を発表。"],
["🎤","一言どうぞ","今の人は架空の受賞スピーチを一言。"],
["🧃","水分補給休憩","飲みたい人は好きな飲み物を自分のペースでどうぞ。"],
["🔄","もう一回逆回転","進行方向が逆になる。"],
["🦀","カニの一礼","今の人は座ったままカニのポーズをしよう。"],
["🌟","褒め合いタイム","誰か1人を褒めよう。"],
["🤖","機械の声","今の人はロボットの声で一言どうぞ。"],
["💬","雑談こそ本番","なんでもいいので一言雑談を。"]
];
const deck=[...tasks.map((x,i)=>({id:'q'+i,kind:'mission',e:x[0],title:x[1],desc:x[2]})),...instant.map((x,i)=>({id:'i'+i,kind:'event',e:x[0],title:x[1],desc:x[2]}))];
let S=null,mode='hand',count=null,names=[],stage='home',currentCard=null,extra=0,turnCounter=0;
function button(t,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+t+'</button>'}
function render(h){app.innerHTML=h;window.scrollTo(0,0)}
function home(){S=null;stage='home';count=null;render('<div class="kicker">スマホを回す、ばかばかしいゲーム</div><h1 class="hero">このゲーム、<br><span style="color:#f4d77c">バグってます。</span></h1><p class="sub">こっそり変な行動をして、バレずに勝とう！<br>攻撃よりも、笑った人が負け……かも。</p><div class="panel"><div class="label">モードを選択</div><div class="toggle"><button id="mode-hand" class="active" onclick="chooseMode(\'hand\')">🃏 手札制</button><button id="mode-random" onclick="chooseMode(\'random\')">🎲 完全ランダム</button></div><div class="label">① プレイヤー人数を選択</div><div class="count-grid">'+Array.from({length:8},(_,i)=>'<button class="count-option" id="count-'+(i+3)+'" onclick="chooseCount('+(i+3)+')">'+(i+3)+'人</button>').join('')+'</div><div id="name-step" class="hidden"><div class="label">② プレイヤー名</div><p class="tiny">空欄でもOK</p><div id="names" class="stack"></div>'+button('ゲーム開始！','begin()')+'</div></div><details class="panel rules"><summary>遊び方</summary><p>カードの秘密ミッションを次の自分のターンまでに達成しよう。その時にスマホへカードを再表示して、全員に見せて証明。参加者全員の判定で成功なら優勝！</p><p>各プレイヤーには最初から秘密の勝利条件も配られる。こちらも自分のターンに達成宣言できる。</p><p>手札制は3枚から1枚選ぶ。完全ランダム制は1枚引いて強制発動。ゲーム外での行動を強制しないこと。飲酒は任意でノンアルコールでも遊べます。</p></details>')}
function chooseMode(m){mode=m;$('#mode-hand').classList.toggle('active',m==='hand');$('#mode-random').classList.toggle('active',m==='random')}
function chooseCount(n){let saved=[...document.querySelectorAll('.namefield')].map(x=>x.value);count=n;document.querySelectorAll('.count-option').forEach(b=>b.classList.toggle('active',b.id==='count-'+n));$('#name-step').classList.remove('hidden');$('#names').innerHTML=Array.from({length:n},(_,i)=>'<label class="name-item"><span>'+(i+1)+'人目</span><input maxlength="16" class="field namefield" placeholder="プレイヤー'+(i+1)+'" value="'+esc(saved[i]||'')+'"></label>').join('')}
function begin(){names=[...document.querySelectorAll('.namefield')].map((x,i)=>x.value.trim()||'プレイヤー'+(i+1));init()}
function init(){S={people:names.map((n,i)=>({name:n,id:i,secret:pick(tasks),pending:null,hand:[],alive:true})),turn:0,dir:1,winner:null,log:[],mode,skip:0};for(let p of S.people)refill(p);stage='pass';display()}
function refill(p){while(p.hand.length<3)p.hand.push(pick(deck))}
function nextTurn(){S.turn=(S.turn+S.dir+S.people.length)%S.people.length;turnCounter++;stage='pass';display()}
function person(){return S.people[S.turn]}
function cardUI(c){return '<div class="card single" style="background:'+(c.kind==='event'?'#bdd7f2':'#f2d4a9')+'"><span class="kind">'+(c.kind==='event'?'意味不明イベント':'秘密ミッション')+'</span><span class="emoji">'+c.e+'</span><span class="ct">'+esc(c.title)+'</span><span class="cd">'+esc(c.desc)+'</span></div>'}
function header(){return '<div class="row spread"><span class="kicker">このゲーム、バグってます。</span><span class="pill">'+(S.mode==='hand'?'手札':'完全ランダム')+'</span></div><div class="stats"><span class="stat">ターン '+(turnCounter+1)+'</span><span class="stat">方向 '+(S.dir===1?'→':'←')+'</span><span class="stat">残り '+S.people.filter(p=>p.alive).length+'人</span></div>'}
function display(){
if(stage==='end'){let p=S.people[S.winner];render('<div class="center"><div class="bigemoji">🏆</div><h1>'+esc(p.name)+'の優勝！</h1><p class="sub">'+esc(S.reason)+'</p></div>'+button('同じメンバーでもう一回','init()')+button('タイトルに戻る','home()','secondary'));return}
let p=person();
if(stage==='pass'){render(header()+'<div class="panel center"><div class="bigemoji">📱</div><h2>'+esc(p.name)+'さんにスマホを渡して！</h2><p class="tiny">ミッションは本人だけが見よう</p></div>'+button('本人が受け取った！','ready()')+button('タイトルに戻る','home()','secondary'));return}
if(stage==='ready'){let pending=p.pending?'<div class="panel"><div class="kicker">前のターンのミッション</div><h2>'+esc(p.pending.title)+'</h2><p>'+esc(p.pending.desc)+'</p>'+button('みんなにカードを見せて判定！','claim(false)')+button('達成できなかった','failPending()','secondary')+'</div>':'';render(header()+'<div class="panel"><h2>'+esc(p.name)+'の秘密の勝利条件</h2><p>'+esc(p.secret[0]+' '+p.secret[1])+'</p><p class="sub">'+esc(p.secret[2])+'</p>'+button('この条件を達成した！ みんなに公開','claim(true)','secondary')+'</div>'+pending+(p.pending?'':'<div class="panel">'+(S.mode==='hand'?'<p>今回使うカードを1枚選ぼう</p><div class="cards">'+p.hand.map((c,i)=>'<button class="card" style="background:'+(c.kind==='event'?'#bdd7f2':'#f2d4a9')+'" onclick="select('+i+')"><span class="emoji">'+c.e+'</span><b>'+esc(c.title)+'</b><span class="cd">'+esc(c.desc)+'</span></button>').join('')+'</div>':button('ランダムカードを引く','drawCard()'))+'</div>')+(p.pending?'':button('カードを使わず次へ','advance()','ghost')));return}
if(stage==='card'){render(header()+'<div class="panel center"><h2>カード発動！</h2>'+cardUI(currentCard)+'<p class="tiny">'+(currentCard.kind==='mission'?'このカードは次の自分のターンに再表示されます。周りに秘密にして行動しよう！':'このイベントはここで発動！')+'</p></div>'+button('スマホを次の人へ','advance()'));return}
if(stage==='judge'){render(header()+'<div class="panel center"><h2>🎉 達成発表タイム！</h2><p>全員に画面を見せて、実際に達成したか判定しよう</p><div class="title">'+esc(currentCard.title)+'</div><p>'+esc(currentCard.desc)+'</p></div>'+button('成功！ 優勝！','decide(true)')+button('失敗！ 続行','decide(false)','secondary'));return}
}
function ready(){stage='ready';display()}
function select(i){let p=person();if(p.pending)return;p.hand.splice(i,1);currentCard=arguments.length?currentCard:null;currentCard=selectedCard;}
// Rebound below to keep selected card before removing it
select=function(i){let p=person();if(p.pending||stage!=='ready')return;currentCard=p.hand.splice(i,1)[0];refill(p);playCard()}
function drawCard(){if(stage!=='ready'||person().pending)return;currentCard=pick(deck);playCard()}
function playCard(){if(currentCard.kind==='mission')person().pending=currentCard;else{if(currentCard.title.includes('逆回転'))S.dir*=-1;if(currentCard.title==='順番飛ばし')S.skip=1;if(currentCard.title==='おかわり')S.skip=-1;}stage='card';display()}
function advance(){if(stage==='card'||stage==='ready'){if(S.skip===1){S.skip=0;S.turn=(S.turn+S.dir+S.people.length)%S.people.length}if(S.skip===-1){S.skip=0;stage='pass';display();return}nextTurn()}}
function claim(secret){let p=person();currentCard=secret?{title:p.secret[1],desc:p.secret[2],e:p.secret[0],kind:'mission'}:p.pending;S.claimSecret=secret;stage='judge';display()}
function failPending(){person().pending=null;stage='ready';display()}
function decide(ok){let p=person();if(ok){S.winner=p.id;S.reason='「'+currentCard.title+'」達成！';stage='end';display()}else{if(!S.claimSecret)p.pending=null;stage='ready';display()}}
window.addEventListener('DOMContentLoaded',home);
</script></body></html>
